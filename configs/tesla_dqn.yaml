experiment: tesla_dqn_trading
env: Tesla-Daily
algo: dqn
timesteps: 200_000
eval_episodes: 10
seed: 42
reward: simple
hyperparams:
  learning_rate: 2.7506271155371943e-05  # Optuna, maximiza retorno en val
  buffer_size: 50_000
  batch_size: 32
  learning_starts: 1000
  gamma: 0.99
tune:
  trials: 10
  timesteps: 50000
  search_space:
    learning_rate: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
    batch_size: {type: categorical, choices: [32, 64, 128]}
